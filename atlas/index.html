<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Atlas personal para estudiar Ciencia Política con trazabilidad académica y memoria local."
    />
    <title>Atlas · Ciencia Política</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación principal">
        <a class="brand" href="#/" aria-label="Inicio del Atlas">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span><strong>Atlas</strong><small>Ciencia Política</small></span>
        </a>

        <nav class="primary-nav">
          <a data-route="home" href="#/">
            <span aria-hidden="true">⌂</span> Mi recorrido
          </a>
          <a data-route="subject" href="#/materia/economia-politica-i">
            <span aria-hidden="true">◫</span> Materias
          </a>
          <a data-route="glossary" href="#/glosario">
            <span aria-hidden="true">◇</span> Glosario
          </a>
        </nav>

        <section class="sidebar-card" aria-labelledby="memory-title">
          <div class="memory-icon" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <p class="eyebrow" id="memory-title">Memory Card</p>
            <p><strong id="memory-records">0 registros</strong></p>
            <p class="muted">Guardada sólo en este dispositivo.</p>
          </div>
          <div class="memory-actions">
            <button class="button button-small" id="export-memory" type="button">Exportar</button>
            <label class="button button-small button-ghost" for="import-memory">Importar</label>
            <input id="import-memory" type="file" accept="application/json,.json" hidden />
          </div>
        </section>

        <p class="privacy-note"><span aria-hidden="true">●</span> Privado por diseño</p>
      </aside>

      <div class="page-column">
        <header class="topbar">
          <button class="menu-button" id="menu-button" type="button" aria-label="Abrir menú" aria-expanded="false">☰</button>
          <div class="breadcrumb" id="breadcrumb">Mi recorrido</div>
          <div class="source-status"><span></span> Piloto · fuentes 2026</div>
        </header>
        <main id="contenido" tabindex="-1"></main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
